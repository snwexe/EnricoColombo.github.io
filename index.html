<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enrico Colombo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
  }
  p.subtitle {
    margin: 0 0 24px;
    color: #94a3b8;
    font-size: 15px;
  }
  .links {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    color: #e2e8f0;
    text-decoration: none;
    padding: 10px 18px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    font-size: 14px;
    transition: background 0.2s ease;
  }
  .links a:hover {
    background: rgba(255,255,255,0.1);
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">EC</div>
    <h1>Enrico Colombo</h1>
    <p class="subtitle">Estudante de Programação</p>
    <div class="links">
      <a href="https://github.com/snwexe" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:enriconc1007@gmail.com">E-mail</a>
    </div>
    <footer>Página publicada com GitHub Pages</footer>
  </div>
</body>
</html>
